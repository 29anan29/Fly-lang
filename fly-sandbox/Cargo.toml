[package]
name = "fly-sandbox"
version = "0.1.0"
edition = "2021"
description = "Fly-Lang 跨平台轻量沙箱 — Rust + Wasmtime + RustPython"
authors = ["Fly-Lang Contributors"]

[dependencies]
wasmtime = "26"
wasmtime-wasi = "26"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = []
http-client = ["dep:reqwest"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
