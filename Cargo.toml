[package]
name = "fly-lang"
version = "0.1.0"
edition = "2021"
description = "Fly-Lang: Python 安全超集转译器（Rust 核心，checker 留 Go）"
license = "MIT"

[[bin]]
name = "fly"
path = "src/main.rs"

[profile.release]
strip = true
lto = true

[dependencies]
ed25519-dalek = "3.0.0"
flate2 = "1.1.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging"] }
webpki-roots = "1.0.9"
zip = "8.6.0"
