name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (checkd/sandboxd 守护进程专用：vet / test / fuzz smoke / errorinfo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: errorinfo 双真源一致性
        run: ./scripts/check-errorinfo.sh
      - name: fuzz smoke（checkd 守护进程安全核心；lexer/parser/compile 为 checkd 内部实现，一并保障）
        run: |
          go test -fuzz FuzzParse -fuzztime 8s ./internal/parser/
          go test -fuzz FuzzLexer -fuzztime 8s ./internal/lexer/
          go test -fuzz FuzzCheckSource -fuzztime 8s ./internal/compile/
          go test -fuzz FuzzSecurityCheck -fuzztime 8s ./internal/checker/

  rust:
    name: Rust (build / test / fmt check / golden 行为)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: cargo build
        run: cargo build --release
      - name: go 守护进程
        run: |
          go build -o target/release/fly-checkd ./cmd/fly-checkd
          go build -o target/release/fly-sandboxd ./cmd/fly-sandboxd
          go build -o target/debug/fly-checkd ./cmd/fly-checkd
      - name: cargo test
        run: cargo test
      - name: fly fmt --check（golden 正例必须 fmt 干净；errors/example 反例含预期编译错误跳过）
        run: ./target/release/fly fmt --check testdata/golden/
      - name: golden 产物行为（python3 实跑）
        run: |
          python3 testdata/golden/hello.py
          python3 testdata/golden/edge.py

  security_regression:
    name: 安全反例回归（红队 + 交互矩阵）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go test 安全专项
        run: go test -run 'Redteam|Interaction|Only|Escape|Taint|Guard|AugAssign' -v ./internal/checker/ 2>&1 | tail -40
