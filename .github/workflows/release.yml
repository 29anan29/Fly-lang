name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  python-matrix:
    name: python ${{ matrix.py }} 产物实跑
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Go 全量测试（TestGolden/TestSandboxEscape/TestRuntimeCatch 走当前 python 实跑产物）
        run: go test ./...
      - name: 构建 fly-checkd（Rust LSP 集成测试 full_session 依赖同目录二进制）
        run: go build -o target/debug/fly-checkd ./cmd/fly-checkd
      - name: Rust 测试（build_golden 逐字节 + lexer/parser + lsp）
        run: cargo test

  linux:
    name: linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-linker for aarch64
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VER=${VERSION#v}
          mkdir -p dist npm-bin
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then
              FLY_VERSION=$VER FLY_COMMIT=$SHA cargo build --release
              cp target/release/fly dist/fly
            else
              FLY_VERSION=$VER FLY_COMMIT=$SHA CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc cargo build --release --target aarch64-unknown-linux-gnu
              cp target/aarch64-unknown-linux-gnu/release/fly dist/fly
            fi
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o dist/fly-checkd ./cmd/fly-checkd
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o dist/fly-sandboxd ./cmd/fly-sandboxd
            tar -czf dist/fly-linux-$arch.tar.gz -C dist fly fly-checkd fly-sandboxd
            cp dist/fly npm-bin/fly-linux-$arch
            cp dist/fly-checkd npm-bin/fly-checkd-linux-$arch
            cp dist/fly-sandboxd npm-bin/fly-sandboxd-linux-$arch
            rm -f dist/fly dist/fly-checkd dist/fly-sandboxd

            mkdir -p pkg/usr/bin pkg/usr/share/pixmaps pkg/DEBIAN
            if [ "$arch" = "amd64" ]; then
              cp target/release/fly pkg/usr/bin/fly
            else
              cp target/aarch64-unknown-linux-gnu/release/fly pkg/usr/bin/fly
            fi
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o pkg/usr/bin/fly-checkd ./cmd/fly-checkd
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o pkg/usr/bin/fly-sandboxd ./cmd/fly-sandboxd
            cp assets/icon.png pkg/usr/share/pixmaps/fly.png
            printf 'Package: flylang\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: %s\nMaintainer: 29anan29\nDescription: Fly-Lang - Python 3.10+ 安全增强超集转译器（safe/only/lock/mask/cage/guard/seal/trace）\n' "$VER" "$arch" > pkg/DEBIAN/control
            dpkg-deb --build --root-owner-group pkg dist/fly-linux-$arch.deb
            rm -rf pkg
          done
          ls -la dist/
      - name: Sign packages (ed25519)
        if: env.SIGN_PRIVATE_KEY != ''
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.SIGN_PRIVATE_KEY }}
        run: |
          go run ./tools/sign dist/*.tar.gz dist/*.deb
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-pkgs
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-linux
          path: npm-bin/*
          if-no-files-found: error

  macos:
    name: macOS packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VER=${VERSION#v}
          mkdir -p dist perarch/amd64 perarch/arm64 npm-bin
          FLY_VERSION=$VER FLY_COMMIT=$SHA cargo build --release
          cp target/release/fly perarch/arm64/fly
          FLY_VERSION=$VER FLY_COMMIT=$SHA cargo build --release --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/fly perarch/amd64/fly
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o perarch/amd64/fly-checkd ./cmd/fly-checkd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o perarch/arm64/fly-checkd ./cmd/fly-checkd
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o perarch/amd64/fly-sandboxd ./cmd/fly-sandboxd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o perarch/arm64/fly-sandboxd ./cmd/fly-sandboxd
          tar -czf dist/fly-darwin-amd64.tar.gz -C perarch/amd64 fly fly-checkd fly-sandboxd
          tar -czf dist/fly-darwin-arm64.tar.gz -C perarch/arm64 fly fly-checkd fly-sandboxd
          cp perarch/amd64/fly npm-bin/fly-darwin-amd64
          cp perarch/arm64/fly npm-bin/fly-darwin-arm64
          cp perarch/amd64/fly-checkd npm-bin/fly-checkd-darwin-amd64
          cp perarch/arm64/fly-checkd npm-bin/fly-checkd-darwin-arm64
          cp perarch/amd64/fly-sandboxd npm-bin/fly-sandboxd-darwin-amd64
          cp perarch/arm64/fly-sandboxd npm-bin/fly-sandboxd-darwin-arm64
          lipo -create perarch/amd64/fly perarch/arm64/fly -output dist/fly-universal

          # .pkg 安装包（/usr/local/bin）
          mkdir -p pkgroot/usr/local/bin
          cp dist/fly-universal pkgroot/usr/local/bin/fly
          cp perarch/amd64/fly-checkd pkgroot/usr/local/bin/fly-checkd
          cp perarch/amd64/fly-sandboxd pkgroot/usr/local/bin/fly-sandboxd
          pkgbuild --root pkgroot --identifier com.flylang.fly --version "$VER" dist/fly-macos-universal.pkg

          # .dmg 磁盘映像
          mkdir -p dmgstage
          cp dist/fly-universal dmgstage/fly
          cp perarch/amd64/fly-checkd dmgstage/fly-checkd
          cp perarch/amd64/fly-sandboxd dmgstage/fly-sandboxd
          cp README.md dmgstage/README.md
          hdiutil create -volname "Fly $VER" -srcfolder dmgstage -ov -format UDZO dist/fly-macos-universal.dmg

          rm dist/fly-universal
          ls -la dist/
      - name: Sign packages (ed25519)
        if: env.SIGN_PRIVATE_KEY != ''
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.SIGN_PRIVATE_KEY }}
        run: |
          go run ./tools/sign dist/*.pkg dist/*.dmg dist/*.tar.gz
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkgs
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-darwin
          path: npm-bin/*
          if-no-files-found: error

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build and package
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $VER = $env:VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force dist, npm-bin | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            if ($arch -eq 'amd64') {
              $env:FLY_VERSION = $VER; $env:FLY_COMMIT = $env:SHA
              cargo build --release
              Copy-Item target\release\fly.exe dist\fly.exe
            } else {
              $env:FLY_VERSION = $VER; $env:FLY_COMMIT = $env:SHA
              cargo build --release --target aarch64-pc-windows-msvc
              Copy-Item target\aarch64-pc-windows-msvc\release\fly.exe dist\fly.exe
            }
            $env:CGO_ENABLED = '0'
            $env:GOOS = 'windows'
            $env:GOARCH = $arch
            go build -trimpath -o dist\fly-checkd.exe .\cmd\fly-checkd
            go build -trimpath -o dist\fly-sandboxd.exe .\cmd\fly-sandboxd
            Compress-Archive -Path dist\fly.exe, dist\fly-checkd.exe, dist\fly-sandboxd.exe -DestinationPath dist\fly-windows-$arch.zip
            Copy-Item dist\fly.exe npm-bin\fly-windows-$arch.exe
            Copy-Item dist\fly-checkd.exe npm-bin\fly-checkd-windows-$arch.exe
            Copy-Item dist\fly-sandboxd.exe npm-bin\fly-sandboxd-windows-$arch.exe
            if ($arch -eq 'amd64') {
              Move-Item dist\fly.exe dist\fly-installer.exe
            } else {
              Remove-Item dist\fly.exe
            }
            Remove-Item dist\fly-checkd.exe, dist\fly-sandboxd.exe
          }
          # SFX 自解压安装包（amd64）
          & 'C:\Program Files\7-Zip\7z.exe' a -t7z -sfx -mx9 dist\fly-windows-amd64-installer.exe dist\fly-installer.exe | Out-Null
          Remove-Item dist\fly-installer.exe
          Get-ChildItem dist
      - name: Sign packages (ed25519)
        if: env.SIGN_PRIVATE_KEY != ''
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.SIGN_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $files = (Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          go run ./tools/sign $files
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pkgs
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-windows
          path: npm-bin/*
          if-no-files-found: error

  vsix:
    name: vscode extension
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/vscode-fly/package-lock.json
      - name: Package extension
        working-directory: editor/vscode-fly
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          VER=${VERSION#v}
          sed -i "s/\"version\": \"[0-9][^\"]*\"/\"version\": \"$VER\"/" package.json
          mkdir -p ../../dist
          npx --yes @vscode/vsce package --out ../../dist/fly-lang-${VERSION#v}.vsix
      - name: Delete stale artifact (rerun-safe)
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | jq -r '.artifacts[] | select(.name=="vsix-pkgs") | .id' \
            | xargs -r -I{} curl -sS -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/{}"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-pkgs
          path: dist/*.vsix
          if-no-files-found: error
      - name: Publish to VSCode Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editor/vscode-fly
        run: |
          npx --yes @vscode/vsce publish --skip-duplicate -p "${VSCE_PAT}"

  npm:
    name: npm package
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-bin
          merge-multiple: true
      - name: Assemble npm package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER=${VERSION#v}
          chmod +x npm-bin/fly-linux-* npm-bin/fly-darwin-* npm-bin/fly-checkd-* npm-bin/fly-sandboxd-*
          cp npm-bin/fly-linux-* npm-bin/fly-darwin-* npm-bin/fly-windows-* npm/fly-lang/bin/
          cp npm-bin/fly-checkd-linux-amd64 npm/fly-lang/bin/fly-checkd
          cp npm-bin/fly-checkd-linux-arm64 npm/fly-lang/bin/fly-checkd-arm64
          cp npm-bin/fly-checkd-darwin-amd64 npm/fly-lang/bin/fly-checkd-darwin
          cp npm-bin/fly-checkd-darwin-arm64 npm/fly-lang/bin/fly-checkd-darwin-arm64
          cp npm-bin/fly-checkd-windows-amd64.exe npm/fly-lang/bin/fly-checkd.exe
          cp npm-bin/fly-checkd-windows-arm64.exe npm/fly-lang/bin/fly-checkd-arm64.exe
          cp npm-bin/fly-sandboxd-linux-amd64 npm/fly-lang/bin/fly-sandboxd
          cp npm-bin/fly-sandboxd-linux-arm64 npm/fly-lang/bin/fly-sandboxd-arm64
          cp npm-bin/fly-sandboxd-darwin-amd64 npm/fly-lang/bin/fly-sandboxd-darwin
          cp npm-bin/fly-sandboxd-darwin-arm64 npm/fly-lang/bin/fly-sandboxd-darwin-arm64
          cp npm-bin/fly-sandboxd-windows-amd64.exe npm/fly-lang/bin/fly-sandboxd.exe
          cp npm-bin/fly-sandboxd-windows-arm64.exe npm/fly-lang/bin/fly-sandboxd-arm64.exe
          rm -f npm-bin/fly-checkd-* npm-bin/fly-sandboxd-*
          ls -la npm/fly-lang/bin/
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$VER\"/" npm/fly-lang/package.json
          cd npm/fly-lang && npm pack --dry-run 2>&1 | tail -15
      - uses: actions/upload-artifact@v4
        with:
          name: npm-pkg
          path: npm/fly-lang/bin/*
          if-no-files-found: error
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: npm/fly-lang
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm publish --access public
      - name: Publish to GitHub Packages
        working-directory: npm/fly-lang
        env:
          GH_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.name='@29anan29/fly-lang';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          echo "//npm.pkg.github.com/:_authToken=${GH_NPM_TOKEN}" > .npmrc
          npm publish --registry=https://npm.pkg.github.com

  release:
    name: publish release
    needs: [linux, macos, windows, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-pkgs'
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Fly-Lang $GITHUB_REF_NAME
            - Linux: .deb（amd64/arm64）、tar.gz
            - macOS: .pkg + .dmg（universal）、tar.gz
            - Windows: .zip（amd64/arm64）、自解压 exe
            - VSCode 插件：fly-lang-*.vsix（LSP 编译期诊断，v0.2.0+ 要求）
            - npm：\`npm install -g fly-lang\`（二进制全平台单包，见 npm job）
            更新命令：\`fly update\`（ed25519 签名验证：产物 .sig 由 SIGN_PRIVATE_KEY 签名，客户端内嵌公钥校验）"
