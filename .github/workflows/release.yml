name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION_LDFLAGS: -X flylang/internal/version.Repo=29anan29/Fly-lang

jobs:
  linux:
    name: linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VER=${VERSION#v}
          ldflags="-s -w -X flylang/internal/version.Version=$VER -X flylang/internal/version.Commit=$SHA $VERSION_LDFLAGS"
          mkdir -p dist npm-bin
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o dist/fly ./cmd/fly
            tar -czf dist/fly-linux-$arch.tar.gz -C dist fly
            cp dist/fly npm-bin/fly-linux-$arch
            rm dist/fly

            mkdir -p pkg/usr/bin pkg/usr/share/pixmaps pkg/DEBIAN
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o pkg/usr/bin/fly ./cmd/fly
            cp assets/icon.png pkg/usr/share/pixmaps/fly.png
            printf 'Package: flylang\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: %s\nMaintainer: 29anan29\nDescription: Fly-Lang - Python 3.10+ 安全增强超集转译器（safe/only/lock/mask/cage/guard/seal/trace）\n' "$VER" "$arch" > pkg/DEBIAN/control
            dpkg-deb --build --root-owner-group pkg dist/fly-linux-$arch.deb
            rm -rf pkg
          done
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-pkgs
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-linux
          path: npm-bin/*
          if-no-files-found: error

  macos:
    name: macOS packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VER=${VERSION#v}
          ldflags="-s -w -X flylang/internal/version.Version=$VER -X flylang/internal/version.Commit=$SHA $VERSION_LDFLAGS"
          mkdir -p dist perarch/amd64 perarch/arm64 npm-bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o perarch/amd64/fly ./cmd/fly
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o perarch/arm64/fly ./cmd/fly
          tar -czf dist/fly-darwin-amd64.tar.gz -C perarch/amd64 fly
          tar -czf dist/fly-darwin-arm64.tar.gz -C perarch/arm64 fly
          cp perarch/amd64/fly npm-bin/fly-darwin-amd64
          cp perarch/arm64/fly npm-bin/fly-darwin-arm64
          lipo -create perarch/amd64/fly perarch/arm64/fly -output dist/fly-universal

          # .pkg 安装包（/usr/local/bin）
          mkdir -p pkgroot/usr/local/bin
          cp dist/fly-universal pkgroot/usr/local/bin/fly
          pkgbuild --root pkgroot --identifier com.flylang.fly --version "$VER" dist/fly-macos-universal.pkg

          # .dmg 磁盘映像
          mkdir -p dmgstage
          cp dist/fly-universal dmgstage/fly
          cp README.md dmgstage/README.md
          hdiutil create -volname "Fly $VER" -srcfolder dmgstage -ov -format UDZO dist/fly-macos-universal.dmg

          rm dist/fly-universal
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkgs
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-darwin
          path: npm-bin/*
          if-no-files-found: error

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $VER = $env:VERSION.TrimStart('v')
          $ldflags = "-s -w -X flylang/internal/version.Version=$VER -X flylang/internal/version.Commit=$env:SHA $env:VERSION_LDFLAGS"
          New-Item -ItemType Directory -Force dist, npm-bin | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            $env:CGO_ENABLED = '0'
            $env:GOOS = 'windows'
            $env:GOARCH = $arch
            go build -trimpath -ldflags $ldflags -o dist\fly.exe .\cmd\fly
            Compress-Archive -Path dist\fly.exe -DestinationPath dist\fly-windows-$arch.zip
            Copy-Item dist\fly.exe npm-bin\fly-windows-$arch.exe
            if ($arch -eq 'amd64') {
              Move-Item dist\fly.exe dist\fly-installer.exe
            } else {
              Remove-Item dist\fly.exe
            }
          }
          # SFX 自解压安装包（amd64）
          & 'C:\Program Files\7-Zip\7z.exe' a -t7z -sfx -mx9 dist\fly-windows-amd64-installer.exe dist\fly-installer.exe | Out-Null
          Remove-Item dist\fly-installer.exe
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pkgs
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-windows
          path: npm-bin/*
          if-no-files-found: error

  vsix:
    name: vscode extension
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/vscode-fly/package-lock.json
      - name: Package extension
        working-directory: editor/vscode-fly
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          npm ci
          VER=${VERSION#v}
          sed -i "s/\"version\": \"[0-9][^\"]*\"/\"version\": \"$VER\"/" package.json
          mkdir -p ../../dist
          npx --yes @vscode/vsce package --out ../../dist/fly-lang-${VERSION#v}.vsix
      - name: Delete stale artifact (rerun-safe)
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | jq -r '.artifacts[] | select(.name=="vsix-pkgs") | .id' \
            | xargs -r -I{} curl -sS -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/{}"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-pkgs
          path: dist/*.vsix
          if-no-files-found: error
      - name: Publish to VSCode Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editor/vscode-fly
        run: |
          npx --yes @vscode/vsce publish --skip-duplicate -p "${VSCE_PAT}"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-pkgs
          path: dist/*.vsix
          if-no-files-found: error

  npm:
    name: npm package
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-bin
          merge-multiple: true
      - name: Assemble npm package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER=${VERSION#v}
          chmod +x npm-bin/fly-linux-* npm-bin/fly-darwin-*
          cp npm-bin/* npm/fly-lang/bin/
          ls -la npm/fly-lang/bin/
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$VER\"/" npm/fly-lang/package.json
          cd npm/fly-lang && npm pack --dry-run 2>&1 | tail -15
      - uses: actions/upload-artifact@v4
        with:
          name: npm-pkg
          path: npm/fly-lang/bin/*
          if-no-files-found: error
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: npm/fly-lang
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm publish --access public
      - name: Publish to GitHub Packages
        working-directory: npm/fly-lang
        env:
          GH_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.name='@29anan29/fly-lang';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          echo "//npm.pkg.github.com/:_authToken=${GH_NPM_TOKEN}" > .npmrc
          npm publish --registry=https://npm.pkg.github.com

  release:
    name: publish release
    needs: [linux, macos, windows, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-pkgs'
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-dev* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            $PRERELEASE \
            --notes "Fly-Lang $GITHUB_REF_NAME
            - Linux: .deb（amd64/arm64）、tar.gz
            - macOS: .pkg + .dmg（universal）、tar.gz
            - Windows: .zip（amd64/arm64）、自解压 exe
            - VSCode 插件：fly-lang-*.vsix（LSP 编译期诊断，v0.2.0+ 要求）
            - npm：\`npm install -g fly-lang\`（二进制全平台单包，见 npm job）
            更新命令：\`fly update\`（dev 版默认走 dev 渠道，\`--channel release\` 切正式版）"
